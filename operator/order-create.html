
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Order | Bedjo Cleaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/operator-dashboard.css?v=20260528-9" />
  <link rel="stylesheet" href="../css/order-create.css?v=20260528-9" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.BC_EDIT_ORDER_ID = new URLSearchParams(window.location.search).get("edit");
    if (window.BC_EDIT_ORDER_ID) {
      document.title = "Edit Order | Bedjo Cleaner";
    }
  </script>
  <script defer src="../js/supabase.js?v=20260528-2"></script>
  <script defer src="../js/notification-helper.js?v=20260528-2"></script>
  <script defer src="../js/auth-guard.js?v=20260528-2"></script>
  <script defer src="../js/order-create.js?v=20260603-1"></script>
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-brand">
      <img src="../assets/logo.png" alt="Bedjo Cleaner" class="drawer-logo-img" />
      <span class="brand-name">Bedjo Cleaner</span>
    </div>
    <div class="drawer-line"></div>
    <nav class="drawer-nav">
      <a href="operator-dashboard.html" class="nav-item">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
      <a href="orders.html" class="nav-item active">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="9"/>
        </svg>
        Orders
      </a>
      <a href="transactions.html" class="nav-item">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="6" r="2" fill="currentColor" stroke="none"/>
          <circle cx="5" cy="12" r="2" fill="currentColor" stroke="none"/>
          <circle cx="5" cy="18" r="2" fill="currentColor" stroke="none"/>
          <line x1="10" y1="6" x2="21" y2="6"/>
          <line x1="10" y1="12" x2="21" y2="12"/>
          <line x1="10" y1="18" x2="21" y2="18"/>
        </svg>
        Transactions
      </a>
      <a href="notifications.html" class="nav-item" style="display:none;">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        Notifications
      </a>
    </nav>
  </aside>

  <div class="main-wrap" id="mainWrap">
    <header class="topbar">
      <div class="tb-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2148C0" stroke-width="2.8" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="tb-title" id="pageTitle">Create Order</h1>
        <script>
          if (window.BC_EDIT_ORDER_ID) {
            document.getElementById("pageTitle").textContent = "Edit Order";
          }
        </script>
      </div>
      <div class="tb-right">
        <button class="icon-btn" onclick="window.location.href='notifications.html'" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <div class="user-pill" id="userPill">
          <div class="avatar-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2148C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="user-info">
            <span class="u-name" id="uName">Operator</span>
            <span class="u-role">Operator</span>
          </div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="u-dropdown" id="uDropdown">
            <button class="dd-logout" id="logoutBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="form-card">
        <div class="form-card-header">
          <h2 class="form-title" id="formTitle">Create Order</h2>
          <script>
            if (window.BC_EDIT_ORDER_ID) {
              document.getElementById("formTitle").textContent = "Edit Order";
            }
          </script>
        </div>
        <div class="form-card-body">

          <div class="form-row-full">
            <div class="form-group">
              <label>Customer Name <span class="req">*</span></label>
              <input type="text" id="fCustomer" />
              <span class="err-msg" id="errCustomer"></span>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label>Email <span class="req">*</span></label>
              <input type="email" id="fEmail" />
              <span class="err-msg" id="errEmail"></span>
            </div>
            <div class="form-group">
              <label>Select Branch</label>
              <div class="fselect-wrap" id="branchWrap">
                <div class="fselect-display" id="branchDisplay">
                  <span id="branchText">Choose branch</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="fselect-dropdown" id="branchDropdown">
                  <div class="fselect-opt" data-val="BEC"><span class="opt-title">BEC</span></div>
                  <div class="fselect-opt" data-val="Ciwalk"><span class="opt-title">Ciwalk</span></div>
                  <div class="fselect-opt" data-val="PVJ"><span class="opt-title">PVJ</span></div>
                  <div class="fselect-opt" data-val="TSM"><span class="opt-title">TSM</span></div>
                  <div class="fselect-opt" data-val="BTC"><span class="opt-title">BTC</span></div>
                </div>
              </div>
            </div>
          </div>

          <div class="form-row-full">
            <div class="form-group">
              <label>No WhatsApp <span class="req">*</span></label>
              <input type="tel" id="fWa" />
              <span class="err-msg" id="errWa"></span>
            </div>
          </div>

          <!-- Items section — dirender oleh JS -->
          <div class="items-section" id="itemsSection"></div>
          <button class="btn-add-item" id="btnAddItem">+ Add Items</button>

          <div class="form-row-2">
            <div class="form-group">
              <label>Payment Method <span class="req">*</span></label>
              <div class="fselect-wrap" id="paymentWrap">
                <div class="fselect-display" id="paymentDisplay">
                  <span id="paymentText">Choose method</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="fselect-dropdown" id="paymentDropdown">
                  <div class="fselect-opt" data-val="cod"><span class="opt-title">Cash</span></div>
                  <div class="fselect-opt" data-val="transfer"><span class="opt-title">Transfer Bank</span></div>
                  <div class="fselect-opt" data-val="ewallet"><span class="opt-title">QRIS / E-Wallet</span></div>
                </div>
              </div>
              <span class="err-msg" id="errPayment"></span>
            </div>
            <div class="form-group">
              <label>Status <span class="req">*</span></label>
              <div class="fselect-wrap" id="statusWrap">
                <div class="fselect-display" id="statusDisplay">
                  <span id="statusText">Choose status</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="fselect-dropdown" id="statusDropdown">
                  <div class="fselect-opt" data-val="pending"><span class="opt-title">Pending</span></div>
                  <div class="fselect-opt" data-val="on_process"><span class="opt-title">On Process</span></div>
                  <div class="fselect-opt" data-val="completed"><span class="opt-title">Completed</span></div>
                </div>
              </div>
              <span class="err-msg" id="errStatus"></span>
            </div>
          </div>

          <div class="form-footer">
            <button class="btn-save" id="btnSave">Save</button>
            <script>
              if (window.BC_EDIT_ORDER_ID) {
                document.getElementById("btnSave").textContent = "Update Order";
              }
            </script>
            <button class="btn-cancel" id="btnCancel">Cancel</button>
          </div>

        </div>
      </div>
    </main>
  </div>

</body>
</html>
