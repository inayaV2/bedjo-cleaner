<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | Bedjo Cleaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/operator-dashboard.css?v=20260528-9" />
  <link rel="stylesheet" href="../css/orders.css?v=20260528-9" />
  <style>
    .notifications-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(17, 24, 39, .06);
      overflow: hidden;
    }
    .notifications-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 28px;
      border-bottom: 1px solid #e5e7eb;
    }
    .notification-list {
      display: grid;
    }
    .notification-item {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto 10px;
      gap: 14px;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid #eef2f7;
      background: #fff;
    }
    .notification-item:last-child { border-bottom: 0; }
    .notification-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #e8efff;
      color: #2148c0;
      font-size: 20px;
    }
    .notification-title {
      margin: 0 0 4px;
      font-weight: 900;
      color: #0f172a;
    }
    .notification-message {
      margin: 0;
      color: #64748b;
      font-size: .94rem;
      line-height: 1.35;
    }
    .notification-time {
      color: #94a3b8;
      font-size: .86rem;
      white-space: nowrap;
    }
    .notification-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2563eb;
    }
    .notification-dot.read { background: transparent; }
    .notification-empty {
      padding: 42px;
      text-align: center;
      color: #64748b;
    }
    @media (max-width: 720px) {
      .notification-item {
        grid-template-columns: 42px minmax(0, 1fr) 8px;
      }
      .notification-time {
        grid-column: 2 / 4;
      }
      .notifications-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase.js?v=20260528-2"></script>
  <script defer src="../js/auth-guard.js?v=20260528-2"></script>
  <script defer src="../js/notifications.js?v=20260528-2"></script>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-brand">
      <img src="../assets/logo.png" alt="Bedjo Cleaner" class="drawer-logo-img" />
      <span class="brand-name">Bedjo Cleaner</span>
    </div>
    <div class="drawer-line"></div>
    <nav class="drawer-nav">
      <a href="operator-dashboard.html" class="nav-item">Dashboard</a>
      <a href="orders.html" class="nav-item">Orders</a>
      <a href="transactions.html" class="nav-item">Transactions</a>
      <a href="notifications.html" class="nav-item active" style="display:none;">Notifications</a>
    </nav>
  </aside>

  <div class="main-wrap" id="mainWrap">
    <header class="topbar">
      <div class="tb-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">☰</button>
        <div class="tb-title-wrap">
          <h1 class="tb-title">Notifications</h1>
          <p class="tb-sub">Update aktivitas order, payment, dan status</p>
        </div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" onclick="window.location.href='notifications.html'" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="notifications-card">
        <div class="notifications-toolbar">
          <h2 class="section-h" style="margin:0;">Notifications</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn-outline" id="btnMarkAll">Mark all read</button>
            <button class="btn-create" id="btnClearAll">Clear all</button>
          </div>
        </div>
        <div id="notificationsList" class="notification-list"></div>
      </div>
    </main>
  </div>
</body>
</html>
