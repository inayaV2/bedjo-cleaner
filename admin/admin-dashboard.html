<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bedjo Cleaner – Admin Dashboard</title>
  <link rel="stylesheet" href="../css/admin-dashboard.css?v=20260603-5" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- SIDEBAR / DRAWER -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo_bedjo.png" alt="Bedjo Cleaner" class="logo-img"/>
      <span class="logo-text">Bedjo Cleaner</span>
    </div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html" class="nav-item active" id="nav-dashboard">
        <i class="fa-solid fa-house"></i>
        <span>Dashboard</span>
      </a>
      <a href="users.html" class="nav-item" id="nav-users">
        <i class="fa-solid fa-users"></i>
        <span>Users</span>
      </a>
      <a href="export.html" class="nav-item" id="nav-export">
        <i class="fa-solid fa-file-export"></i>
        <span>Export Data</span>
      </a>
      <a href="cleanup.html" class="nav-item" id="nav-cleanup">
        <i class="fa-solid fa-box-archive"></i>
        <span>Arsip & Cleanup</span>
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-wrapper" id="mainWrapper">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <div class="user-info" id="userDropdownToggle">
          <div class="user-avatar-box">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2148C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </svg>
</div>
          <div class="user-text">
            <span class="user-name" id="topbarName">Admin</span>
            <span class="user-role" id="topbarRole">Admin</span>
          </div>
          <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
        </div>
        <div class="dropdown-menu" id="userDropdown">
          <button type="button" class="dd-logout" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="content">

      <!-- USER TABLE CARD -->
      <div class="card table-card">
        <h2 class="card-title">User Table</h2>
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" class="search-input" id="searchInput" placeholder="Search"/>
        </div>
        <div class="table-wrapper">
          <table class="user-table" id="userTable">
            <thead>
              <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Branch</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <!-- Rows injected by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- BOTTOM ROW -->
      <div class="bottom-row">

        <!-- ADD NEW USER FORM -->
        <div class="card form-card">
          <h2 class="card-title">Add New User</h2>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" class="form-input"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" class="form-input" autocomplete="new-password"/>
          </div>
          <div class="form-group">
            <label>Assign Role</label>
            <select id="roleInput" class="form-input">
              <option value="operator">Operator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label>Branch</label>
            <select id="branchInput" class="form-input">
              <option value="">Choose branch</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="statusInput" class="form-input">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <button class="btn-submit" id="createAccountBtn">Create Account</button>
        </div>

        <!-- ACTIVITY OVERVIEW -->
        <div class="card activity-card">
          <h2 class="card-title">Activity Overview</h2>
          <ul class="activity-list" id="activityList">
            <!-- Injected by JS -->
          </ul>
        </div>

      </div>
    </main>
  </div>

  <!-- EDIT USER MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 class="modal-title">Edit User</h3>
      <input type="hidden" id="editIndex"/>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="editUsername" class="form-input"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" class="form-input"/>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="editRole" class="form-input">
          <option value="operator">Operator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Branch</label>
        <select id="editBranch" class="form-input">
          <option value="">Choose branch</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="editStatus" class="form-input">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelEdit">Cancel</button>
        <button class="btn-submit" id="saveEdit">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=20260603-5"></script>
  <script src="../js/auth-guard.js?v=20260603-5"></script>
  <script src="../js/admin-dashboard.js?v=20260603-5"></script>
</body>
</html>
